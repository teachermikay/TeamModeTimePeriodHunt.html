<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Battle: Advanced Logic Edition</title>
    <style>
        :root {
            --bg-pastel: #fdfcf0;
            --header-pastel: #e3f2fd;
            --team-a-color: #ffcfdf;
            --team-b-color: #cfdfff;
            --accent-mint: #baffc9;
            --accent-peach: #ffdfba;
            --text-dark: #444;
            --btn-gray: #bdc3c7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-pastel);
            color: var(--text-dark);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            flex-shrink: 0;
            min-height: 100px;
            background: var(--header-pastel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 5px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 30;
        }

        .score-box {
            padding: 5px 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            flex: 0 1 80px;
            border: 3px solid #fff;
            font-size: 0.8rem;
        }
        .score-a { background: var(--team-a-color); }
        .score-b { background: var(--team-b-color); }
        .score-val { font-size: 1.5rem; display: block; }

        .control-hub {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .timer-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .timer-display { font-size: 1.5rem; font-family: monospace; background: #fff; padding: 2px 8px; border-radius: 10px; border: 2px solid #ddd; }
        
        .adj-btns { display: flex; flex-direction: column; gap: 2px; }
        .adj-btn { cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 2px 6px; font-size: 12px; }

        .button-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

        .nav-btn {
            background: #fff; border: 2px solid #ddd; padding: 5px 8px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px;
            transition: transform 0.1s;
        }

        #arena {
            flex-grow: 1;
            display: flex;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .divider {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 4px;
            background: white; z-index: 5; transform: translateX(-50%);
        }

        /* UPDATED CENTRAL CHECK BUTTON STYLING */
        #central-check {
            position: absolute; 
            left: 50%; 
            top: 260px; 
            transform: translateX(-50%);
            z-index: 40; 
            background: var(--btn-gray); /* Default Gray */
            color: #7f8c8d;
            border: 4px solid #fff;
            padding: 10px 20px; 
            font-size: 1.1rem; 
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            cursor: default; 
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.3s ease;
            pointer-events: none; /* Disabled until both lock */
        }

        #central-check.active {
            background: var(--accent-mint);
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            pointer-events: auto;
        }

        .team-side { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px; 
            position: relative; 
            height: 100%;
            overflow: hidden;
        }

        #question-box {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: #fff; padding: 8px 15px; border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;
            width: 90%; max-width: 380px; border: 3px solid var(--accent-mint);
        }

        .drop-zone {
            width: 100%; height: 80px; background: rgba(255,255,255,0.6);
            border: 3px dashed #ddd; border-radius: 15px; margin-top: 85px;
            display: flex; justify-content: center; align-items: center; gap: 5px;
            flex-wrap: wrap; padding: 5px;
        }

        .word-bank { 
            width: 100%; 
            max-height: 130px; 
            margin-top: 10px; 
            display: flex; flex-wrap: wrap; justify-content: center; 
            align-content: flex-start; gap: 6px; 
            overflow-y: auto;
            padding: 5px;
        }

        .tile { 
            background: #fff; padding: 8px 12px; border-radius: 10px; 
            font-weight: bold; font-size: 1rem; cursor: pointer; 
            box-shadow: 0 3px 0 #ddd; border: 1px solid #eee;
            touch-action: manipulation;
        }
        .tile.locked { background: #e0e0e0 !important; color: #999 !important; cursor: default !important; box-shadow: none !important; }

        .btn-lock { 
            background: #ffeaa7; 
            margin: 10px 0; 
            width: 90%; 
            flex-shrink: 0; 
            min-height: 45px; 
            z-index: 10;
        }
        .btn-lock.locked { background: var(--btn-gray) !important; color: #7f8c8d; cursor: default; }

        .symbol { position: absolute; font-size: 60px; font-weight: bold; text-shadow: 2px 2px 10px rgba(0,0,0,0.1); animation: floatUp 2s ease-out forwards; pointer-events: none; z-index: 100; }
        
        @keyframes floatUp { 0% { transform: translate(-50%, 0); opacity: 1; top: 60%; } 100% { transform: translate(-50%, -300px); opacity: 0; top: 60%; } }

        @media (max-width: 768px) {
            #central-check { top: 230px; font-size: 0.9rem; }
            .word-bank { max-height: 100px; }
        }
    </style>
</head>
<body>

<header>
    <div class="score-box score-a">TEAM A <span id="score-a-val" class="score-val">0</span></div>

    <div class="control-hub">
        <div class="timer-row">
            <div class="adj-btns">
                <button class="adj-btn" onclick="adjTime(10)">▲</button>
                <button class="adj-btn" onclick="adjTime(-10)">▼</button>
            </div>
            <div id="timer-display" class="timer-display">01:00</div>
            <button class="nav-btn" onclick="toggleTimer()" id="play-pause" style="background: var(--accent-mint);">PLAY</button>
            <button class="nav-btn" onclick="stopTimer()" style="background: var(--accent-peach);">STOP</button>
            <button class="nav-btn" onclick="toggleMusic()" id="music-btn" style="background: #e0e0e0;">🎵 BGM</button>
        </div>
        <div class="button-row">
            <button class="nav-btn" onclick="shuffleQuestions()">SHUFFLE</button>
            <button class="nav-btn" onclick="nextRound()">NEXT</button>
            <button class="nav-btn" onclick="proclaimWinner()">WINNER</button>
            <button class="nav-btn" onclick="fullReset()">RESET</button>
        </div>
    </div>

    <div class="score-box score-b">TEAM B <span id="score-b-val" class="score-val">0</span></div>
</header>

<div id="arena">
    <div class="divider"></div>
    <div id="question-box">
        <div id="q-prompt" style="font-size: 18px; font-weight: bold;">Loading...</div>
        <div id="q-target" style="font-size: 14px; color: #888;">...</div>
    </div>

    <button id="central-check" onclick="checkBothTeams()">✔️ CHECK ANSWERS</button>

    <div class="team-side" id="side-a" style="background: #fff9fb;">
        <div id="zone-a" class="drop-zone"></div>
        <div id="bank-a" class="word-bank"></div>
        <button id="lock-btn-a" class="nav-btn btn-lock" onclick="lockTeam('a')">🔒 LOCK A</button>
    </div>

    <div class="team-side" id="side-b" style="background: #f9fbff;">
        <div id="zone-b" class="drop-zone"></div>
        <div id="bank-b" class="word-bank"></div>
        <button id="lock-btn-b" class="nav-btn btn-lock" onclick="lockTeam('b')">🔒 LOCK B</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval = null;
    let musicPlaying = false;

    function beep(f, t, d, v=0.1) {
        let o = audioCtx.createOscillator(); let g = audioCtx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    function playGameNote(freq, type, duration, vol) {
        let o = audioCtx.createOscillator();
        let g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + duration);
    }

    function toggleMusic() {
        const btn = document.getElementById('music-btn');
        if (musicPlaying) {
            clearInterval(musicInterval);
            musicPlaying = false;
            btn.innerText = "🎵 BGM: OFF";
            btn.style.background = "#e0e0e0";
        } else {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            musicPlaying = true;
            btn.innerText = "🎵 BGM: ON";
            btn.style.background = "#baffc9";
            let step = 0;
            const melody = [261.63, 329.63, 392.00, 523.25];
            musicInterval = setInterval(() => {
                playGameNote(step % 2 === 0 ? 110 : 82, 'triangle', 0.4, 0.05);
                if (step % 4 === 2) playGameNote(800, 'square', 0.05, 0.01);
                if (step % 2 === 0) playGameNote(melody[Math.floor(Math.random() * melody.length)], 'sine', 0.2, 0.03);
                step++;
            }, 250);
        }
    }

    let questions = [
        { q: "Today is April 18", t: "April 16", ans: "twodaysago" },
        { q: "Now it's 1:30 PM", t: "11:30 AM", ans: "twohoursago" },
        { q: "Today is Tuesday", t: "Monday", ans: "yesterday" },
        { q: "Now it's morning April 23", t: "April 22 (night)", ans: "lastnight" },
        { q: "Now it is 5:00 PM", t: "4:00 PM", ans: "anhourago" }
    ];

    let currentQ = 0, scoreA = 0, scoreB = 0, time = 60, timerInt = null;
    let isLockedA = false, isLockedB = false, speedWinner = null;
    const allParts = ["yes", "ter", "day", "last", "night", "two", "days", "ago", "an", "hour", "hours", "to", "day"];

    function initRound() {
        isLockedA = false; isLockedB = false; speedWinner = null;
        document.getElementById('lock-btn-a').classList.remove('locked');
        document.getElementById('lock-btn-b').classList.remove('locked');
        
        // Reset Check Button to Gray
        const checkBtn = document.getElementById('central-check');
        checkBtn.classList.remove('active');

        const item = questions[currentQ];
        document.getElementById('q-prompt').innerText = item.q;
        document.getElementById('q-target').innerText = "...is " + item.t;
        setupBank('a'); setupBank('b');
    }

    function setupBank(team) {
        const bank = document.getElementById(`bank-${team}`);
        const zone = document.getElementById(`zone-${team}`);
        bank.innerHTML = ""; zone.innerHTML = "";
        [...allParts].sort(() => Math.random() - 0.5).forEach(p => {
            const div = document.createElement('div');
            div.className = 'tile'; div.innerText = p;
            div.onclick = () => {
                if ((team === 'a' && isLockedA) || (team === 'b' && isLockedB)) return;
                beep(400, 'sine', 0.05);
                if (div.parentElement === bank) zone.appendChild(div); else bank.appendChild(div);
            };
            bank.appendChild(div);
        });
    }

    function shuffleQuestions() {
        questions.sort(() => Math.random() - 0.5);
        currentQ = 0;
        initRound();
        spawnSymbol('a', '🔀 SHUFFLE'); spawnSymbol('b', '🔀 SHUFFLE');
        beep(440, 'sine', 0.2);
    }

    function updateCheckButtonState() {
        const checkBtn = document.getElementById('central-check');
        if (isLockedA && isLockedB) {
            checkBtn.classList.add('active');
        } else {
            checkBtn.classList.remove('active');
        }
    }

    function lockTeam(team) {
        if (team === 'a' && !isLockedA) {
            isLockedA = true; document.getElementById('lock-btn-a').classList.add('locked');
            document.querySelectorAll('#side-a .tile').forEach(t => t.classList.add('locked'));
            if (!speedWinner) speedWinner = 'a'; beep(300, 'square', 0.1);
        } else if (team === 'b' && !isLockedB) {
            isLockedB = true; document.getElementById('lock-btn-b').classList.add('locked');
            document.querySelectorAll('#side-b .tile').forEach(t => t.classList.add('locked'));
            if (!speedWinner) speedWinner = 'b'; beep(300, 'square', 0.1);
        }
        updateCheckButtonState();
    }

    function checkBothTeams() {
        if (!isLockedA || !isLockedB) return;
        
        // Immediately turn gray again
        const checkBtn = document.getElementById('central-check');
        checkBtn.classList.remove('active');

        const ans = questions[currentQ].ans;
        let anyCorrect = false;

        const process = (team, locked, zoneId) => {
            if (!locked) return;
            const user = Array.from(document.getElementById(zoneId).children).map(t => t.innerText).join('');
            if (user === ans) {
                let pts = 2; if (speedWinner === team) pts += 1;
                if (team === 'a') scoreA += pts; else scoreB += pts;
                spawnSymbol(team, `⭐ +${pts}`);
                anyCorrect = true;
            } else {
                spawnSymbol(team, '☹️');
                if (speedWinner === team) speedWinner = null;
                unlockTeam(team);
            }
        };

        process('a', isLockedA, 'zone-a'); 
        process('b', isLockedB, 'zone-b');
        
        updateScores(); 
        beep(500, 'sine', 0.3);

        if (anyCorrect && timerInt) {
            setTimeout(() => {
                nextRound();
            }, 1000);
        } else if (!anyCorrect) {
            // Re-evaluate if it should be active (in case one team was unlocked)
            updateCheckButtonState();
        }
    }

    function unlockTeam(team) {
        if (team === 'a') { isLockedA = false; document.getElementById('lock-btn-a').classList.remove('locked'); document.querySelectorAll('#side-a .tile').forEach(t => t.classList.remove('locked')); }
        else { isLockedB = false; document.getElementById('lock-btn-b').classList.remove('locked'); document.querySelectorAll('#side-b .tile').forEach(t => t.classList.remove('locked')); }
        updateCheckButtonState();
    }

    function spawnSymbol(team, txt) {
        const s = document.createElement('div'); s.className = 'symbol'; s.innerText = txt;
        s.style.left = team === 'a' ? '25%' : '75%';
        document.body.appendChild(s); setTimeout(() => s.remove(), 2000);
    }

    function updateScores() {
        document.getElementById('score-a-val').innerText = scoreA;
        document.getElementById('score-b-val').innerText = scoreB;
    }

    function adjTime(v) { time = Math.max(0, time + v); updateDisp(); }

    function toggleTimer() {
        const btn = document.getElementById('play-pause');
        if (timerInt) { clearInterval(timerInt); timerInt = null; btn.innerText = "PLAY"; } 
        else { 
            if (audioCtx.state === 'suspended') audioCtx.resume();
            timerInt = setInterval(() => { if (time > 0) { time--; updateDisp(); } else { stopTimer(); } }, 1000); btn.innerText = "PAUSE"; 
        }
    }

    function stopTimer() { clearInterval(timerInt); timerInt = null; document.getElementById('play-pause').innerText = "PLAY"; }
    function updateDisp() { let m = Math.floor(time/60), s = time%60; document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

    function fullReset() { stopTimer(); time = 60; updateDisp(); scoreA = 0; scoreB = 0; updateScores(); currentQ = 0; initRound(); }

    function proclaimWinner() {
        stopTimer();
        let winner = scoreA > scoreB ? 'a' : (scoreB > scoreA ? 'b' : 'both');
        if (winner === 'both') { spawnSymbol('a', '👑 TIE'); spawnSymbol('b', '👑 TIE'); }
        else { spawnSymbol(winner, '👑 WINNER!'); }
        beep(523, 'sine', 0.2); setTimeout(() => beep(659, 'sine', 0.2), 150); setTimeout(() => beep(783, 'sine', 0.4), 300);
    }

    function nextRound() { 
        currentQ = Math.floor(Math.random() * questions.length);
        initRound(); 
    }
    initRound();
</script>
</body>
</html>
